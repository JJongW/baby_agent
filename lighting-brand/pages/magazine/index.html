<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매거진 | ONDO</title>
  <link rel="icon" href="../../favicon.ico?v=3" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="../../common/style.css">
  <!-- 이 페이지에만 필요한 모양. 색, 글꼴, 간격은 common/style.css 의 토큰만 쓴다 (DESIGN.md) -->
  <style>
    .magazine-head { padding-top: var(--space-5); padding-bottom: 0; }
    .magazine-head p { max-width: var(--text-width); }
    .magazine-list { padding-top: var(--space-5); padding-bottom: 0; }

    /* 글 카드: 4:5 사진 → 분류 → 제목. 그림자, 테두리, 둥근 모서리 없음 */
    .article-card { display: block; }
    .article-card img { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; background: var(--hanji-deep); }
    .article-card .eyebrow { margin: var(--space-2) 0 var(--space-1); }
    .article-card .card-title { font-family: var(--font); font-size: var(--text-md); font-weight: 500; line-height: 1.6;
      letter-spacing: -0.01em; margin: 0; color: var(--ink); word-break: keep-all; }
    .article-card:hover .card-title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  </style>
</head>
<body data-page="magazine">
  <header data-site-header></header>
  <main>
    <section class="wrap section magazine-head">
      <h1>매거진</h1>
      <p>한지 조명이 일상의 어느 자리에서 쓰이는지, 짧은 글로 담았어요.</p>
    </section>

    <section class="wrap section magazine-list" aria-label="글 목록">
      <div class="grid">
        <a class="article-card" href="article-1.html">
          <img src="images/article-1-corner.webp" width="1200" height="1500"
               alt="어두운 방 구석 마룻바닥 위에서 켜진 돔 모양의 한지 조명, 옆에 찻잔 하나가 놓여 있다">
          <p class="eyebrow">공간 꾸미기</p>
          <h2 class="card-title">퇴근 후 한 시간, 방의 불을 낮추는 일</h2>
        </a>
        <a class="article-card" href="article-2.html">
          <img src="images/article-2-reading.webp" width="1200" height="1500"
               alt="켜진 둥근 한지 조명 곁에서 펼친 책의 책장을 넘기는 손, 옆에 머그컵이 놓여 있다">
          <p class="eyebrow">인터뷰</p>
          <h2 class="card-title">이 년째 한지 조명과 사는 사람, 정하은</h2>
        </a>
        <a class="article-card" href="article-3.html">
          <img src="../../images/products/T-02-off.webp" width="1200" height="1500"
               alt="불이 꺼진 둥근 한지 테이블 조명, 한지의 결과 대나무 살이 보인다">
          <p class="eyebrow">관리 팁</p>
          <h2 class="card-title">누렇게 바래는 것도 조명의 시간입니다</h2>
        </a>
      </div>
    </section>
  </main>
  <footer data-site-footer></footer>
  <script src="../../common/products.js"></script>
  <script src="../../common/layout.js"></script>
</body>
</html>
