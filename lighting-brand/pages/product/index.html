<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제품 | ONDO</title>
  <link rel="stylesheet" href="../../common/style.css">
  <!-- 이 페이지에만 필요한 모양은 여기 <style>에 쓴다. 색은 common/style.css 의 값(var(--ink) 등)만 쓴다 -->
  <style>
    /* 켜기, 끄기는 카드 안 사진(켜짐, 꺼짐 한 쌍)만 바꾼다. 페이지 바탕은 그대로 둔다 (디자인 규칙 시안 v3)
       색은 common/style.css 의 값만 쓴다. 공통 값이 바뀌면 이 페이지도 따라 바뀐다 */

    /* 페이지 제목: FAQ 페이지와 같은 구조 (eyebrow → h1 → 설명문, 세로로 쌓고 설명문은 36em까지) */
    .product-head p { max-width: 36em; }
    /* 한국어 문장이 단어 중간에서 끊기지 않게 한다 */
    main { word-break: keep-all; overflow-wrap: break-word; }

    /* 스크롤하면 공통 헤더(높이 64px) 바로 아래에 붙는다. 헤더(z-index 10)보다 아래에 깔린다.
       공통 헤더(.site-header)와 같은 모양: 화면 전체 폭, 반투명 바탕과 흐림, 아래 선 하나 */
    .bar-sticky { position: sticky; top: 64px; z-index: 5; margin-top: 56px;
      background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line); }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding-top: 4px; padding-bottom: 4px; font-size: 14px; }
    .bar .count { margin: 0; }

    /* 켜기, 끄기: 머리 메뉴처럼 글자와 밑줄만 쓴다 (시안 v3: 지금 상태는 --ink 글자와 1px 밑줄) */
    .light { display: flex; align-items: center; gap: 12px; }
    .light .divider { color: var(--line); }
    .light button { min-height: 44px; padding: 0 2px; background: none; border: 0; cursor: pointer;
      font: inherit; color: var(--ink-soft); }
    .light button span { padding: 4px 0; border-bottom: 1px solid transparent; transition: color .15s ease, border-color .15s ease; }
    .light button:hover { color: var(--ink); }
    .light button[aria-pressed="true"] { color: var(--ink); }
    .light button[aria-pressed="true"] span { border-bottom-color: var(--ink); }
    .light button:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

    /* 2x2 그리드. 카드 비율은 사진 비율(RATIO, 아래 스크립트)을 따른다: 4:5 또는 가로 3:2 */
    #products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 56px 32px; margin-top: 40px; }
    @media (max-width: 640px) { #products { grid-template-columns: 1fr; gap: 40px; } }
    .card .thumb { aspect-ratio: 4 / 5; background: var(--paper-deep); border-radius: var(--radius);
      position: relative; overflow: hidden; }
    #products.ratio-3x2 .card .thumb { aspect-ratio: 3 / 2; }
    /* 3:2 칸인데 3:2 사진이 아직 없는 제품(S-01)은 4:5 사진을 자르지 않고 칸 가운데에 둔다 */
    #products.ratio-3x2 .card.portrait .thumb img { object-fit: contain; }

    /* 꺼진 사진, 켜진 사진 두 장을 겹쳐 두고 켜진 사진의 투명도만 바꾼다 */
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s ease; }
    .thumb .on { opacity: 0; }
    .lit .thumb .on { opacity: 1; }

    /* 사진이 없는 제품: 같은 비율의 자리에 "사진 준비 중" (시안 v3 사진 쓰는 법) */
    .thumb .pending { display: none; position: absolute; inset: 0; place-items: center;
      font-size: 14px; color: var(--ink-soft); }
    .thumb.no-photo img { display: none; }
    .thumb.no-photo .pending { display: grid; }

    .info { padding-top: 16px; }
    .info .code { font-size: 12px; letter-spacing: .08em; margin: 0 0 8px; }
    .info .name { font-size: 20px; font-weight: 400; margin: 0 0 8px; color: var(--ink); }
    .info .meta { font-size: 14px; margin: 0; }

    @media (max-width: 760px) {
      .bar-sticky { margin-top: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body data-page="product">
  <header data-site-header></header>
  <main>
    <!-- 담당: 정연(윤). PRD 7.2 제품 -->
    <section class="wrap product-head" style="padding-top:48px">
      <p class="eyebrow">Light sculptures</p>
      <h1>제품</h1>
      <p>빛의 밝기보다 빛이 지닌 따뜻함을 생각한다.<br>
        나무 틀에 대나무 살을 감고, 한지를 한 장씩 손으로 붙여 만든다.</p>
    </section>

    <div class="bar-sticky">
      <div class="wrap bar">
        <p class="count" id="count"></p>
        <div class="light" role="group" aria-label="조명">
          <button type="button" data-light="on" aria-pressed="true"><span>불 켜기</span></button>
          <span class="divider" aria-hidden="true">|</span>
          <button type="button" data-light="off" aria-pressed="false"><span>불 끄기</span></button>
        </div>
      </div>
    </div>

    <section class="wrap section" style="padding-top:0">
      <div class="lit" id="products"></div>
    </section>

    <script>
      // 사진 비율. "4x5" 또는 "3x2" 하나만 바꾸면 사진 파일과 카드 비율이 같이 바뀐다
      //   4x5: images/products/<코드>-off.webp, -on.webp
      //   3x2: images/products/<코드>-off-3x2.webp, -on-3x2.webp (없는 제품은 4:5로, 그것도 없으면 "사진 준비 중")
      // 규칙은 images/README.md
      const RATIO = "4x5";
      const IMG = "../../images/products/";
      const photo = (code, state) => RATIO === "3x2" ? `${IMG}${code}-${state}-3x2.webp` : `${IMG}${code}-${state}.webp`;
      const fallback = (code, state) => RATIO === "3x2" ? `data-fallback="${IMG}${code}-${state}.webp"` : "";

      function card(p) {
        return `
          <article class="card">
            <div class="thumb">
              <img class="off" src="${photo(p.code, "off")}" ${fallback(p.code, "off")} alt="${p.name}, 불이 꺼진 모습">
              <img class="on" src="${photo(p.code, "on")}" ${fallback(p.code, "on")} alt="${p.name}, 불이 켜진 모습">
              <span class="pending">사진 준비 중</span>
            </div>
            <div class="info">
              <p class="code">${p.code}</p>
              <h2 class="name">${p.name}</h2>
              <p class="meta">${ONDO_TYPES[p.type]}</p>
              <p class="meta">지름 ${p.width}cm 높이 ${p.height}cm</p>
              <p class="meta">${p.price.toLocaleString("ko-KR")}원</p>
            </div>
          </article>`;
      }

      document.addEventListener("DOMContentLoaded", () => {
        const list = document.getElementById("products");
        list.classList.add(`ratio-${RATIO}`);
        list.innerHTML = ONDO_PRODUCTS.map(card).join("");
        document.getElementById("count").textContent = `${ONDO_PRODUCTS.length}점`;

        // 사진을 못 불러오면: 3:2는 4:5 사진으로(카드에 .portrait), 그것도 없으면 "사진 준비 중"
        list.querySelectorAll("img").forEach((img) => {
          const fail = () => {
            if (img.dataset.fallback) {
              img.src = img.dataset.fallback;
              delete img.dataset.fallback;
              img.closest(".card").classList.add("portrait");
            } else {
              img.closest(".thumb").classList.add("no-photo");
            }
          };
          img.addEventListener("error", fail);
          if (img.complete && img.naturalWidth === 0) fail();
        });

        // 모든 카드를 한 번에 켜고 끈다. 바뀌는 건 카드 안의 사진뿐이다 (켜진 사진의 투명도 0 ↔ 1)
        const buttons = document.querySelectorAll("[data-light]");
        buttons.forEach((b) => b.addEventListener("click", () => {
          const on = b.dataset.light === "on";
          buttons.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
          list.classList.toggle("lit", on);
        }));
      });
    </script>
  </main>
  <footer data-site-footer></footer>
  <script src="../../common/products.js"></script>
  <script src="../../common/layout.js"></script>
</body>
</html>
